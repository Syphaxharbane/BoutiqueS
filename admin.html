<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Ma Boutique</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: Arial, sans-serif; background: #f5f5f5;
    }
    .box {
      width: min(420px, 100%); background: white; padding: 28px;
      border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { margin-top: 0; }
    label { display:block; margin: 16px 0 7px; font-weight: 600; }
    input {
      width:100%; padding:13px; border:1px solid #ddd; border-radius:9px;
      font-size:16px;
    }
    button {
      width:100%; margin-top:20px; padding:13px; border:0;
      border-radius:9px; background:#111; color:white; font-size:16px;
      font-weight:700; cursor:pointer;
    }
    #message { margin-top:15px; min-height:22px; }
    .error { color:#c00; }
    .success { color:#087a35; }
    .hint { color:#666; font-size:14px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Administration</h1>
    <p class="hint">Connecte-toi avec l'adresse e-mail et le mot de passe créés dans Supabase.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Se connecter</button>
    </form>

    <div id="message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.className = "";
      message.textContent = "Connexion en cours...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          message.className = "error";
          message.textContent = "Erreur : " + error.message;
          return;
        }

        message.className = "success";
        message.textContent = "Connexion réussie !";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 500);

      } catch (error) {
        message.className = "error";
        message.textContent = "Erreur de connexion : " + error.message;
      }
    });
  </script>
</body>
</html>
