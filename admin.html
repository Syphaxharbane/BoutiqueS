<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><div class="login-card"><h1>Administration</h1><p class="muted">Connexion sécurisée</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field" style="margin-top:12px"><label>Mot de passe</label><input id="password" type="password" required></div><button class="btn btn-primary" style="width:100%;margin-top:18px" type="submit">Se connecter</button></form><div id="message"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const f=document.getElementById('loginForm'),m=document.getElementById('message');
f.addEventListener('submit',async e=>{e.preventDefault();m.className='message';m.textContent='Connexion...';const {error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){m.className='message error';m.textContent=error.message;return}m.className='message ok';m.textContent='Connexion réussie !';setTimeout(()=>location.href='dashboard.html',500)});
</script></body></html>
